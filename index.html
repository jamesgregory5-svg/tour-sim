<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a14">
<title>Daily Sim ⛳ Golf Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--acc:#ffd24a;--acc2:#3fe0b0;--pan:rgba(8,14,18,.72);--line:rgba(255,255,255,.13)}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a14;color:#fff;font-family:"Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.up{text-transform:uppercase;letter-spacing:.08em}
.hide{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.on{display:block}
#banner{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;align-items:stretch;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
#banner .hn{background:#fff;color:#0b1a14;font-weight:900;font-size:30px;min-width:56px;display:grid;place-items:center;padding:0 10px;border-radius:10px 0 0 10px;line-height:1}
#banner .hn small{display:block;font-size:9px;letter-spacing:.14em;font-weight:800;opacity:.6;text-align:center}
#banner .hi{background:var(--pan);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 12px;min-width:150px}
#banner .hi b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
#banner .hi span{font-size:12px;opacity:.8;font-weight:600;letter-spacing:.04em}
#banner .sc{background:var(--acc2);color:#04241a;font-weight:900;font-size:22px;min-width:54px;display:grid;place-items:center;border-radius:0 10px 10px 0;padding:0 10px}
#banner .sc small{display:block;font-size:9px;letter-spacing:.12em;font-weight:800;opacity:.65;text-align:center}
#tl{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:12px;background:var(--pan);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;font-size:18px;font-weight:800;border:1px solid var(--line)}
#mini{border-radius:12px;background:var(--pan);border:1px solid var(--line);display:block}
#shot{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:calc(76px + env(safe-area-inset-bottom));background:var(--pan);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;border:1px solid var(--line);padding:8px 12px;min-width:210px;display:grid;grid-template-columns:auto auto;gap:2px 16px}
#shot .k{font-size:9.5px;opacity:.65;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
#shot .v{font-size:19px;font-weight:900;line-height:1.05;white-space:nowrap}
#shot .v small{font-size:11px;opacity:.7;font-weight:700}
#wArr{display:inline-block;color:#9fe3ff;transition:transform .2s}
#lm{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(78px + env(safe-area-inset-top));width:178px;background:var(--pan);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;border:1px solid var(--line);padding:8px 10px;font-size:12px;pointer-events:auto;transition:opacity .3s}
#lm h4{margin:0 0 4px;font-size:10px;letter-spacing:.16em;opacity:.7;display:flex;justify-content:space-between}
#lm .r{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#lm .r span{opacity:.7;font-weight:600}#lm .r b{font-weight:800;font-variant-numeric:tabular-nums}
#lm .shape{margin-top:5px;text-align:center;font-weight:900;letter-spacing:.12em;font-size:12px;color:var(--acc)}
#lm.min .r,#lm.min .shape{display:none}
#third{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;opacity:0;transition:opacity .35s,transform .35s;filter:drop-shadow(0 8px 20px rgba(0,0,0,.4))}
#third.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
#third .lab{background:var(--acc);color:#1c1606;font-weight:900;padding:8px 12px;border-radius:10px 0 0 10px;font-size:14px;letter-spacing:.1em;display:grid;place-items:center;white-space:nowrap}
#third .cells{display:flex;background:var(--pan);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:0 10px 10px 0}
#third .c{padding:6px 14px;text-align:center;border-left:1px solid var(--line)}
#third .c small{display:block;font-size:9px;letter-spacing:.14em;opacity:.7;font-weight:800}
#third .c b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
#clubs{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));display:flex;gap:4px;justify-content:center;pointer-events:auto;background:linear-gradient(180deg,transparent,rgba(0,0,0,.45))}
#clubs button{min-width:40px;padding:6px 4px 5px;border-radius:10px;background:rgba(8,14,18,.66);border:1px solid var(--line);font-weight:900;font-size:13px;line-height:1;position:relative}
#clubs button small{display:block;font-size:9px;opacity:.65;font-weight:700;margin-top:3px}
#clubs button.sel{background:#fff;color:#0b1a14}
#clubs button.rec::after{content:"";position:absolute;left:50%;top:-5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--acc2);box-shadow:0 0 8px var(--acc2)}
#clubs button.rec{border-color:var(--acc2)}
#rec{position:absolute;left:50%;bottom:calc(58px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;font-weight:800;letter-spacing:.06em;background:rgba(8,14,18,.6);padding:3px 10px;border-radius:9px;white-space:nowrap}
#rec b{color:var(--acc2)}
/* swing */
#meter{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:128px;height:238px;pointer-events:none}
#strike{position:absolute;right:calc(150px + env(safe-area-inset-right));bottom:calc(110px + env(safe-area-inset-bottom));width:128px;pointer-events:none;background:rgba(8,14,18,.8);border-radius:12px;border:1px solid var(--line);padding:7px 9px}
#strike .st{font-size:10px;letter-spacing:.16em;font-weight:900;opacity:.8;text-align:center}
#strike canvas{display:block;margin:3px auto 4px}
#strike .sr{display:flex;justify-content:space-between;font-size:11px;line-height:1.5}#strike .sr span{opacity:.7;font-weight:800;letter-spacing:.08em;font-size:9.5px}#strike .sr b{font-weight:900;font-variant-numeric:tabular-nums}
#hud.intro #shot,#hud.intro #lm,#hud.intro #clubs,#hud.intro #acts,#hud.intro #meter,#hud.intro #strike,#hud.intro #shape,#hud.intro #hint,#hud.intro #rec,#hud.intro #putt{display:none!important}
#shape{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(60px + env(safe-area-inset-bottom));display:flex;gap:3px;pointer-events:auto}
#shape button{font-size:10px;font-weight:900;letter-spacing:.06em;padding:6px 7px;border-radius:8px;background:rgba(8,14,18,.66);border:1px solid var(--line)}
#shape button.sel{background:var(--acc);color:#1c1606}
#hint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:.14em;font-size:13px;opacity:.85;text-shadow:0 2px 8px rgba(0,0,0,.6);text-align:center;transition:opacity .4s;white-space:nowrap}
#hint small{display:block;font-size:10px;opacity:.75;letter-spacing:.08em;margin-top:4px;font-weight:700}
#aimb{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#acts{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:calc(178px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#acts .ib{font-size:11px;font-weight:900;letter-spacing:.05em}
#putt{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pan);border-radius:12px;border:1px solid var(--line);padding:6px 14px;text-align:center;display:none;min-width:170px}
#putt b{font-size:24px;font-weight:900}#putt small{display:block;font-size:10px;letter-spacing:.12em;opacity:.7;font-weight:800}
#putt .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:5px;overflow:hidden;position:relative}
#putt .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc2),var(--acc),#ff6a4a)}
#putt .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
#toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.9);z-index:8;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast b{display:block;font-size:46px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.55);font-style:italic}
#toast span{font-size:14px;font-weight:800;background:rgba(8,14,18,.7);padding:5px 12px;border-radius:10px;display:inline-block;margin-top:6px;letter-spacing:.06em}
#intro{position:fixed;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));z-index:6;display:none;justify-content:center;pointer-events:none}
#intro.on{display:flex}
#intro .card{background:var(--pan);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;border:1px solid var(--line);padding:12px 18px;text-align:center;min-width:260px;animation:rise .5s ease}
#intro .card .n{font-size:12px;letter-spacing:.2em;font-weight:900;color:var(--acc)}
#intro .card h2{margin:3px 0;font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
#intro .card p{margin:2px 0;font-size:13px;opacity:.85;font-weight:600}
#intro .card .sk{font-size:10px;opacity:.6;letter-spacing:.12em;margin-top:6px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#next{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:none}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;z-index:10;overflow:auto;background:radial-gradient(ellipse at 50% 0%,rgba(30,70,50,.55),rgba(4,10,8,.92) 70%);padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:block}
.screen.dim{background:rgba(4,10,8,.6)}
.wrap{max-width:860px;margin:0 auto}
.logo{font-size:52px;font-weight:900;letter-spacing:-.02em;line-height:.95;font-style:italic;text-transform:uppercase;margin:6vh 0 4px;text-align:center}
.logo span{color:var(--acc)}
.tag{text-align:center;opacity:.8;font-weight:700;letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.menu{max-width:400px;margin:28px auto 0;display:flex;flex-direction:column;gap:9px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;font-weight:900;font-size:16px;letter-spacing:.08em;text-transform:uppercase;background:var(--acc);color:#1c1606;text-align:left;position:relative}
.btn small{display:block;font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:700;opacity:.75;margin-top:2px}
.btn.alt{background:rgba(255,255,255,.09);color:#fff;border:1px solid var(--line)}
.btn.c{text-align:center}
.btn:disabled{opacity:.5}
.disc{text-align:center;font-size:11px;opacity:.6;margin-top:22px;line-height:1.5}
.hdr{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.hdr h2{margin:0;font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cc{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.cc:hover{background:rgba(255,255,255,.12)}
.cc .rk{font-size:22px;font-weight:900;min-width:38px;text-align:center;color:var(--acc)}
.cc .nm{font-weight:800;font-size:14.5px;line-height:1.2}
.cc .lo{font-size:11.5px;opacity:.7;margin-top:2px}
.cc .rc{font-size:11px;margin-top:4px;color:var(--acc2);font-weight:800;letter-spacing:.03em}
.cc.home{background:linear-gradient(120deg,rgba(63,224,176,.22),rgba(255,210,74,.12));border-color:rgba(63,224,176,.5);grid-column:1/-1}
.badge{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.14em;background:var(--acc2);color:#04241a;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.sec{font-size:11px;font-weight:900;letter-spacing:.18em;opacity:.65;margin:16px 2px 8px;text-transform:uppercase}
.pn{background:rgba(10,18,16,.94);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:520px;margin:4vh auto}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.seg button{flex:1;min-width:80px;padding:10px 8px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:13px}
.seg button small{display:block;font-size:10.5px;opacity:.7;font-weight:600;margin-top:2px}
.seg button.sel{background:#fff;color:#0b1a14}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
td,th{padding:4px 2px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
th{font-size:10px;opacity:.7;letter-spacing:.06em}
td.l,th.l{text-align:left}
.sc-e{}.sc-b{background:rgba(63,224,176,.25);border-radius:50%}.sc-ea{background:var(--acc);color:#111;border-radius:50%;font-weight:900}.sc-bo{background:rgba(255,120,90,.22)}.sc-db{background:rgba(255,80,60,.42)}
.stt{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.stt div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px}
.stt b{display:block;font-size:20px;font-weight:900}.stt span{font-size:10px;opacity:.7;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.scr{overflow-x:auto}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{display:flex;justify-content:space-between;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700}
#rangeP{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(60px + env(safe-area-inset-top));z-index:6;width:min(330px,calc(100vw - 20px));background:rgba(8,14,18,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;border:1px solid var(--line);padding:8px;display:none}
#rangeP.on{display:block}
#rangeP .tabs{display:flex;gap:4px;margin-bottom:6px}
#rangeP .tabs button{flex:1;font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:6px 2px;border-radius:8px;background:rgba(255,255,255,.07)}
#rangeP .tabs button.sel{background:#fff;color:#0b1a14}
#rangeP canvas{width:100%;display:block;border-radius:10px}
#modeBar{position:absolute;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--pan);border-radius:12px;padding:6px 14px;font-weight:900;font-size:13px;letter-spacing:.08em;text-align:center;border:1px solid var(--line);white-space:nowrap}
#modeBar small{display:block;font-size:10px;opacity:.7;letter-spacing:.06em;font-weight:700}
#fps{position:fixed;right:4px;bottom:2px;font-size:9px;opacity:.4;z-index:20;pointer-events:none}
@media (max-width:640px){#lm{width:150px;font-size:11px;top:calc(70px + env(safe-area-inset-top))}#banner .hn{font-size:24px;min-width:44px}#banner .hi{min-width:110px}#shot{min-width:0;bottom:calc(72px + env(safe-area-inset-bottom));padding:6px 9px}#shot .v{font-size:16px}#clubs{gap:2px;padding:5px 3px}#clubs button{min-width:0;flex:1;font-size:11.5px;padding:6px 1px}#clubs button small{font-size:8px}#meter{width:100px;height:190px}#strike{right:auto;left:max(10px,env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));width:112px}#acts{bottom:calc(282px + env(safe-area-inset-bottom))}.logo{font-size:40px}#third .c{padding:5px 9px}#third .c b{font-size:18px}#mini{width:84px!important;height:130px!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
 <div id="tl"><button class="ib" id="bHome" title="Menu">☰</button><canvas id="mini" width="120" height="180" style="width:96px;height:144px"></canvas></div>
 <div id="banner"><div class="hn"><div><small>HOLE</small><span id="bHn">1</span></div></div><div class="hi"><b id="bName">—</b><span id="bPar">PAR 4 · 400 YDS</span></div><div class="sc"><div><small>SCORE</small><span id="bSc">E</span></div></div></div>
 <div id="lm"><h4><span>LAUNCH MONITOR</span><span id="lmT">▾</span></h4><div id="lmRows"></div><div class="shape" id="lmShape">—</div></div>
 <div id="modeBar" class="hide"></div>
 <div id="shot"><div><div class="k">Club</div><div class="v" id="sClub">DR</div></div><div><div class="k">To pin</div><div class="v" id="sDist">0<small> yds</small></div></div><div><div class="k">Lie</div><div class="v" id="sLie">Tee <small>100%</small></div></div><div><div class="k">Wind</div><div class="v"><span id="wArr">↑</span> <span id="sWind">0</span><small> mph</small></div></div></div>
 <div id="acts"><button class="ib" id="bCard" title="Scorecard">CARD</button><button class="ib" id="bView" title="Camera">VIEW</button></div>
 <div id="third"><div class="lab" id="tLab">SHOT</div><div class="cells"><div class="c"><small>CARRY</small><b id="tCarry">0</b></div><div class="c"><small>TOTAL</small><b id="tTot">0</b></div><div class="c"><small>BALL SPD</small><b id="tBs">0</b></div></div></div>
 <canvas id="meter" width="256" height="476"></canvas>
 <div id="strike"><div class="st">STRIKE</div><canvas id="strikeC" width="200" height="140" style="width:100px;height:70px"></canvas><div class="sr"><span>TEMPO</span><b id="tempo">—</b></div><div class="sr"><span>TIMING</span><b id="acc">—</b></div><div class="sr"><span>FACE</span><b id="fF">—</b></div><div class="sr"><span>PATH</span><b id="fP">—</b></div></div>
 <div id="shape"><button data-s="0" class="sel">STRAIGHT</button><button data-s="1">DRAW</button><button data-s="2">FADE</button><button data-t="1">HIGH</button><button data-t="-1">LOW</button></div>
 <div id="hint"><span id="hintT">TAP, CLICK OR PRESS SPACE TO SWING</span><small id="hintS">Tap 2 sets power · tap 3 on the white line · drag sideways to aim</small></div>
 <div id="putt"><small>PUTT</small><b id="pFt">0 ft</b><div class="bar"><i id="pBar"></i><em id="pCup"></em></div><small id="pInfo" style="margin-top:4px">CUP 0 FT</small></div>
 <div id="rec"></div>
 <div id="clubs"></div>
</div>
<div id="intro"><div class="card" id="introC"></div></div>
<div id="toast"><b id="tB"></b><span id="tS"></span></div>
<button class="btn c" id="next" style="width:min(320px,80vw)">Next hole ▸</button>
<div id="rangeP"><div class="tabs"><button data-t="d" class="sel">DISPERSION</button><button data-t="b">MY BAG</button><button data-t="s">SESSION</button></div><canvas id="rangeC" width="620" height="520"></canvas></div>
<div class="screen" id="scMenu"></div>
<div class="screen" id="scSelect"></div>
<div class="screen" id="scSetup"></div>
<div class="screen" id="scRecords"></div>
<div class="screen dim" id="scCard"></div>
<div id="fps"></div>
<script>
'use strict';
const TAU=Math.PI*2,DEG=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>t*t*(3-2*t);
const pad=n=>String(n).padStart(2,'0');
function xmur(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0}
function RNG(seed){let a=typeof seed==='string'?xmur(seed):seed>>>0;const f=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ---- timed 3-tap swing meter ----
   tap 1: start backswing (meter rises 0 -> 115% in ~1.15 s)
   tap 2: set power (meter then races back down at 3x speed = ideal 3:1 tempo)
   tap 3: at the sweet-spot line for accuracy (early = pull/draw, late = push/fade) */
const SW_UP=1000,SW_DOWN=SW_UP/3;
function swNow(){return performance.now()}
function swValue(s,t){if(s.phase==='up')return Math.min(1.15,(t-s.t0)/SW_UP);return s.pow-(t-s.tPow)/SW_DOWN}
function swingTap(){if(G.phase!=='address'&&G.phase!=='putt'&&G.phase!=='swing')return;const t=swNow();let s=G.sw;

  if(s.putt){G.sw=null;const ft=s.ft;if(ft>.4)executeShot({ft});return}
  if(s.phase==='up'){s.pow=swValue(s,t);s.tPow=t;s.phase='down';sfx('tick');return}
  if(s.phase==='down')swingRelease(swValue(s,t),t)}
function swingTick(){const s=G.sw;if(!s)return;const t=swNow();
  if(s.putt){const f=Math.min(1,(t-s.t0)/1700);s.ft=f*G.puttMax;s.pow=f;if(f>=1){/* stays at max until tapped */}updPutt();return}
  const v=swValue(s,t);if(s.phase==='up'){s.pow=v;if(v>=1.15){s.pow=1.15;s.tPow=t;s.phase='down'}}else{s.cur=v;if(v<-.22)swingRelease(-.22,t)}}

  G.lastSw={pow:s.pow,err};const R=RNG(t+'');const e=Math.abs(err);

const fmtFt=yd=>{const ft=yd*3;const f=Math.floor(ft),i=Math.round((ft-f)*12);return f+"' "+(i===12?11:i)+'"'};
$('next').onclick=()=>{if(G.mode==='round')nextHole();else if(G.nextFn)G.nextFn()};

'use strict';
/* ================= range / mini modes ================= */
const RANGE_C={id:'range',name:'Practice Range',par:[4],tees:[{n:'Mat',y:[360]}],style:'parkland',names:['Driving Range'],sig:{}};
const RANGE_FLAGS=[[-16,50],[12,100],[-14,150],[16,200],[-10,250],[8,300]];
function rangeGeo(){const rect=(x0,y0,x1,y1)=>enc([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);const gr=RANGE_FLAGS.map(([x,y],i)=>enc(ellP(x,y,7+y*.02,6+y*.02,24,.08,i)));
  const bk=RANGE_FLAGS.filter((_,i)=>i%2).map(([x,y],i)=>enc(ellP(x+10*(i%2?1:-1),y-9,4,2.6,16,.1,i)));
  return{h:[{l:enc([[0,0],[0,360]])}],f:{gc:[rect(-110,-30,110,400)],fw:[rect(-70,25,70,375)],te:[rect(-14,-6,14,5)],gr,bk,wd:[rect(-110,-30,-88,400),rect(88,-30,110,400),rect(-110,380,110,400)]},t:[]}}
const LD_C={id:'ld',name:'Long Drive Grid',par:[4],tees:[{n:'Grid',y:[420]}],style:'parkland',names:['Long Drive'],sig:{}};
function ldGeo(){const rect=(x0,y0,x1,y1)=>enc([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);return{h:[{l:enc([[0,0],[0,440]])}],f:{gc:[rect(-48,-25,48,470)],fw:[rect(-30,140,30,445)],ro:[rect(-48,-25,48,470)],te:[rect(-10,-6,10,5)],wd:[rect(-80,-25,-60,470),rect(60,-25,80,470)]},t:[]}}
function modeHUD(title,short,sub,score,bar){G.modeTitle=title;G.modeShort=short;G.modeSub=sub;G.modeScore=score;const m=$('modeBar');if(bar){m.innerHTML=bar;m.classList.remove('hide')}else m.classList.add('hide');updHUD()}
function startMode(mode,course,geo,opts){G.round=null;G.mode=mode;hideScreens();$('hud').classList.add('on');$('next').style.display='none';clearLabels();
  const H=buildHole(course,geo,0,0,opts||{});if(opts&&opts.cup)H.cup=opts.cup;setHole(H,opts&&opts.flags);G.ball={x:0,y:0,surf:S_TEE};G.strokes=0;G.pen=0;G.lm=null;G.R.tracerN=0;carryReset();G.onHoled=null;G.onShot=null;G.onRest=null;return H}
// ---- range ----
function startRange(){const H=startMode('range',RANGE_C,rangeGeo(),{flags:null});G.flags=RANGE_FLAGS.map(([x,y],i)=>({x,y,col:[[.9,.15,.1],[1,.8,.1],[.15,.5,.95],[.95,.95,.95],[.9,.15,.1],[1,.8,.1]][i]}));G.cupOn=false;
  G.target={x:0,y:150};G.wind={x:0,y:0,mph:0,a:0};G.allowed=null;G.labels=RANGE_FLAGS.map(([x,y])=>({x,y,t:y+' yds',z:3.2}));
  G.sess=G.sess||{shots:[],fw:[0,0],best:0};G.rTab=G.rTab||'d';$('rangeP').classList.add('on');G.ballOn=true;
  G.onRest=(res,msg)=>{const lm=G.lm;if(!lm||!lm.ball)return;const s={ci:G.anim.ci,carry:lm.carry,total:lm.total,side:lm.side,smash:lm.smash,ball:lm.ball};G.sess.shots.push(s);
    if(s.ci<=2){G.sess.fw[1]++;if(Math.abs(s.side)<16)G.sess.fw[0]++;if(s.total>G.sess.best)G.sess.best=s.total}
    const bag=store('ds.bag')||{};const k=CN[s.ci];bag[k]=(bag[k]||[]);if(s.smash>CLUBS[s.ci].sm*.9){bag[k].push([Math.round(s.carry),Math.round(s.total)]);if(bag[k].length>20)bag[k].shift();store('ds.bag',bag)}
    drawRangePanel()};
  G.afterRest=()=>{G.ball={x:0,y:0,surf:S_TEE};setAddress();modeHUD('Driving Range','RNG','Any club · flags every 50 yds','—')};
  modeHUD('Driving Range','RNG','Any club · flags every 50 yds','—');G.phase='address';G.ballOn=true;setAddress();G.club=6;updClubs();updHUD();drawRangePanel()}
const CCOL=['#ff5a4a','#ff9a3c','#ffc93c','#d7e84a','#8fe36a','#4ad99a','#3fd8d0','#4ab4ff','#6a8cff','#9a78ff','#c36bff','#ff6bd0','#ff8fa8'];
function drawRangePanel(){const c=$('rangeC'),g=c.getContext('2d'),W=c.width,H=c.height;g.clearRect(0,0,W,H);g.fillStyle='rgba(20,40,28,.9)';g.fillRect(0,0,W,H);const sh=(G.sess&&G.sess.shots)||[];
  g.font='700 18px Helvetica,Arial,sans-serif';g.textBaseline='middle';
  if(G.rTab==='d'){const sx=x=>W/2+x*(W/90),sy=y=>H-24-y*(H-44)/320;g.strokeStyle='rgba(255,255,255,.12)';g.fillStyle='rgba(255,255,255,.55)';
    for(let y=50;y<=300;y+=50){g.beginPath();g.moveTo(20,sy(y));g.lineTo(W-20,sy(y));g.stroke();g.fillText(y,4,sy(y)-9)}g.beginPath();g.moveTo(W/2,H-20);g.lineTo(W/2,12);g.stroke();
    for(let ci=0;ci<13;ci++){const L=sh.filter(s=>s.ci===ci);if(!L.length)continue;const mx=L.reduce((a,s)=>a+s.side,0)/L.length,my=L.reduce((a,s)=>a+s.carry,0)/L.length;
      if(L.length>=2){const vx=Math.sqrt(L.reduce((a,s)=>a+(s.side-mx)**2,0)/L.length)+1.5,vy=Math.sqrt(L.reduce((a,s)=>a+(s.carry-my)**2,0)/L.length)+2;g.strokeStyle=CCOL[ci];g.globalAlpha=.85;g.lineWidth=2;g.beginPath();g.ellipse(sx(mx),sy(my),vx*1.5*(W/90),vy*1.5*(H-44)/320,0,0,TAU);g.stroke();g.globalAlpha=.16;g.fillStyle=CCOL[ci];g.fill();g.globalAlpha=1}
      g.fillStyle=CCOL[ci];for(const s of L){g.beginPath();g.arc(sx(s.side),sy(s.carry),4.5,0,TAU);g.fill()}g.fillStyle='#fff';g.fillText(CN[ci],sx(mx)+10,sy(my))}
    if(!sh.length){g.fillStyle='rgba(255,255,255,.7)';g.textAlign='center';g.fillText('Hit some shots: dispersion by club shows here',W/2,H/2);g.textAlign='left'}}
  else if(G.rTab==='b'){const bag=store('ds.bag')||{};const rows=CN.slice(0,13).map(k=>{const a=bag[k]||[];return[k,a.length?a.reduce((x,y)=>x+y[0],0)/a.length:0,a.length?a.reduce((x,y)=>x+y[1],0)/a.length:0,a.length]});
    const rh=(H-30)/13;g.fillStyle='rgba(255,255,255,.6)';g.fillText('MY BAG · avg carry (solid) / total (light) · saved',8,12);let prev=null;
    rows.forEach(([k,ca,to,n],i)=>{const y=26+i*rh+rh/2;g.fillStyle='#fff';g.fillText(k,8,y);if(n){const sx=v=>70+v*(W-150)/320;g.fillStyle='rgba(63,224,176,.3)';g.fillRect(70,y-rh*.35,sx(to)-70,rh*.7);g.fillStyle=CCOL[i];g.fillRect(70,y-rh*.35,sx(ca)-70,rh*.7);
      g.fillStyle='#fff';g.fillText(Math.round(ca)+' / '+Math.round(to),sx(to)+6,y);if(prev)g.fillStyle='rgba(255,255,255,.55)',g.fillText('gap '+Math.round(prev-ca),W-64,y);prev=ca}else{g.fillStyle='rgba(255,255,255,.35)';g.fillText('—',70,y)}})}
  else{const n=sh.length,fw=G.sess?G.sess.fw:[0,0];const sm=n?(sh.reduce((a,s)=>a+s.smash,0)/n).toFixed(2):'—';const st=[['Shots',n],['Fairways (woods)',fw[1]?fw[0]+'/'+fw[1]:'—'],['Best drive',G.sess&&G.sess.best?Math.round(G.sess.best)+' yds':'—'],['Avg smash',sm],['Avg ball speed',n?Math.round(sh.reduce((a,s)=>a+s.ball,0)/n)+' mph':'—'],['Clubs used',new Set(sh.map(s=>s.ci)).size]];
    g.font='800 24px Helvetica,Arial,sans-serif';st.forEach(([k,v],i)=>{const x=(i%2)*W/2+14,y=50+Math.floor(i/2)*150;g.fillStyle='rgba(255,255,255,.6)';g.font='800 17px Helvetica,Arial,sans-serif';g.fillText(k.toUpperCase(),x,y);g.fillStyle='#fff';g.font='900 40px Helvetica,Arial,sans-serif';g.fillText(v,x,y+46)})}}
// ---- closest to the pin (daily seeded par 3) ----
const CTP_POOL=[['augusta',12],['augusta',16],['augusta',4],['cypress',16],['cypress',15],['pebble',7],['pebble',17],['pinevalley',5],['pinevalley',10],['oakmont',6],['shinnecock',11],['merion',17],['ngla',13],['sandhills',13],['fishers',5],['seminole',17],['pacificdunes',11],['riviera',6],['lacc',11],['lookaway',3]];
function ctpToday(){const R=RNG('ctp'+todayKey());const pool=CTP_POOL.filter(([c,h])=>CID[c]&&CID[c].par[h-1]===3);const [cid,h]=pool[R.int(pool.length)];const c=CID[cid];return{cid,h,label:c.name.replace(/ (Golf|Country) Club.*$/,'').replace(/ National.*$/,' National')+' #'+h,wind:windFor('ctpw'+todayKey())}}
function startCtp(){const T=ctpToday();const c=CID[T.cid];const H=startMode('ctp',c,GEO[c.id],{cupSeed:'ctp'+todayKey()});
  G.wind=T.wind;G.allowed=CN.map((_,i)=>i).slice(0,13);G.cupOn=true;G.ballsLeft=5;G.ctpRes=[];G.extraBalls=[];G.labels=null;G.target=null;
  const bar=()=>`CLOSEST TO THE PIN · BALL ${Math.min(5,6-G.ballsLeft)}/5<small>Best ${G.ctpRes.length?fmtFt(Math.min(...G.ctpRes)):'—'} · today's hole: ${esc(T.label)}</small>`;
  G.onRest=(res,msg)=>{const d=res.kind==='sunk'?0:msg?null:distYd(G.ball,H.cup);G.ctpRes.push(d===null?99:d);if(d!==null&&d<99)G.extraBalls.push({x:G.ball.x,y:G.ball.y,z:H.hAt(G.ball.x,G.ball.y)});
    toast(d===null?'NO SCORE':d===0?'ACE!':fmtFt(d),d===null?'Missed the green complex':H.surfAt(G.ball.x,G.ball.y)===S_GREEN?'On the green':'Off the green',1700)};
  G.onHoled=()=>{G.phase='rest';G.restT=0;G.onRest({kind:'sunk'})};
  G.afterRest=()=>{G.ballsLeft--;if(G.ballsLeft<=0){ctpDone(T);return}G.ball={x:0,y:0,surf:S_TEE};G.strokes=0;setAddress();modeHUD('Closest to the Pin','CTP',`${H.yards} yds · Par 3`,G.ctpRes.length?fmtFt(Math.min(...G.ctpRes)):'—',bar())};
  G.modeTitle='Closest to the Pin';modeHUD('Closest to the Pin','CTP',`${H.yards} yds · Par 3`,'—',bar());startIntro()}
function ctpDone(T){const best=Math.min(...G.ctpRes);const R=recLoad();const k=todayKey();const valid=best<99;
  if(valid){if(R.ctp.best===null||best<R.ctp.best)R.ctp.best=best;if(R.ctp.day[k]===undefined||best<R.ctp.day[k])R.ctp.day[k]=best;recSave(R)}
  G.phase='done';show('scCard',`<div class="pn"><div class="hdr"><h2>Closest to the pin</h2></div><div style="font-weight:800">${esc(T.label)} · ${G.H.yards} yds · wind ${T.wind.mph} mph</div>
   <div class="stt"><div><b>${valid?fmtFt(best):'—'}</b><span>Best today (this go)</span></div><div><b>${R.ctp.day[k]!==undefined?fmtFt(R.ctp.day[k]):'—'}</b><span>Best today</span></div><div><b>${R.ctp.best!==null?fmtFt(R.ctp.best):'—'}</b><span>All-time</span></div></div>
   <div style="font-size:13px;opacity:.85">${G.ctpRes.map((d,i)=>'Ball '+(i+1)+': '+(d<99?fmtFt(d):'no score')).join(' · ')}</div>
   <button class="btn c" id="ca" style="margin-top:12px">Play again</button><button class="btn alt c" id="cm">Main menu</button></div>`);$('ca').onclick=startCtp;$('cm').onclick=leaveToMenu}
// ---- long drive ----
function ldToday(){return{wind:windFor('ld'+todayKey())}}
function startLd(){const T=ldToday();const H=startMode('ld',LD_C,ldGeo(),{grid:1});G.flags=[];G.cupOn=false;G.wind=T.wind;G.allowed=[0];G.club=0;G.ballsLeft=6;G.ldRes=[];G.extraBalls=[];G.target={x:0,y:300};
  G.labels=[];for(let y=200;y<=425;y+=25)G.labels.push({x:-34,y,t:y+'',z:.6});
  const bar=()=>`LONG DRIVE · BALL ${Math.min(6,7-G.ballsLeft)}/6<small>Best ${G.ldRes.filter(x=>x>0).length?Math.max(...G.ldRes)+' yds':'—'} · stay inside the grid</small>`;
  G.onRest=(res,msg)=>{const inG=!msg&&Math.abs(G.ball.x)<=30;const d=inG?Math.round(G.ball.y):0;G.ldRes.push(d);if(inG)G.extraBalls.push({x:G.ball.x,y:G.ball.y,z:H.hAt(G.ball.x,G.ball.y)});toast(inG?d+' yds':'FOUL',inG?'In the grid':'Outside the grid',1700)};
  G.afterRest=()=>{G.ballsLeft--;if(G.ballsLeft<=0){ldDone(T);return}G.ball={x:0,y:0,surf:S_TEE};setAddress();G.target={x:0,y:300};modeHUD('Long Drive','LD','Driver only · wind '+T.wind.mph+' mph',Math.max(0,...G.ldRes)||'—',bar())};
  modeHUD('Long Drive','LD','Driver only · wind '+T.wind.mph+' mph','—',bar());G.ballOn=true;setAddress();G.club=0;updClubs();updHUD()}
function ldDone(T){const best=Math.max(0,...G.ldRes);const R=recLoad();const k=todayKey();if(best>R.ld.best)R.ld.best=best;if(!R.ld.day[k]||best>R.ld.day[k])R.ld.day[k]=best;if(best>R.stats.longest)R.stats.longest=best;recSave(R);
  G.phase='done';show('scCard',`<div class="pn"><div class="hdr"><h2>Long drive</h2></div><div class="stt"><div><b>${best||'—'}</b><span>This set</span></div><div><b>${R.ld.day[k]||'—'}</b><span>Best today</span></div><div><b>${R.ld.best||'—'}</b><span>All-time</span></div></div>
   <div style="font-size:13px;opacity:.85">${G.ldRes.map((d,i)=>'Ball '+(i+1)+': '+(d?d+' yds':'foul')).join(' · ')}</div><button class="btn c" id="la" style="margin-top:12px">Play again</button><button class="btn alt c" id="lmm">Main menu</button></div>`);$('la').onclick=startLd;$('lmm').onclick=leaveToMenu}
/* ================= menu background + init ================= */
function menuBG(){const c=CID['augusta'];if(!G.bgH){G.bgH=buildHole(c,GEO.augusta,11,0,{cupSeed:'menu'})}G.round=null;setHole(G.bgH);G.flags=[{x:G.bgH.cup.x,y:G.bgH.cup.y}];G.ball={x:0,y:0,surf:S_TEE};G.bg=true;G.phase='menu';G.R.tracerN=0;G.extraBalls=null;G.cupOn=true;G.ballOn=false}
function menuCam(dt){const H=G.H,c=H.cup;const a=G.time*.05;const r=150;const ex=c.x+Math.cos(a-1.9)*r,ey=c.y+Math.sin(a-1.9)*r;G.cam={eye:[ex,ey,H.hAt(clamp(ex,H.X0,H.X1),clamp(ey,H.Y0,H.Y1))+22],at:[c.x,c.y,2],fov:.75}}
function init(){
  const cv=$('gl');const R=mkGL(cv);if(!R){document.body.insertAdjacentHTML('beforeend','<div class="screen on"><div class="pn">WebGL2 is required. Try a recent Chrome, Edge, Safari or Firefox.</div></div>');return}
  G.R=R;const mob=Math.min(innerWidth,innerHeight)<700;G.scale=Math.min(devicePixelRatio||1,mob?1.6:2);G.PXmax=mob?2.2:3;
  inputInit();fillLM();menuBG();showMenu();requestAnimationFrame(frame)}
const _updCam=updCam;updCam=function(dt){if(G.mode==='menu'){menuCam(dt);return}_updCam(dt)};
